# CI never needs repository secrets: no secrets context is referenced anywhere, so it is safe on fork pull requests.
# Deploys are human-run (docs/DEPLOY-CLOUDFLARE.md); nothing here talks to a Cloudflare, NEAR or LLM account.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm run check
      - run: npm test

  no-secrets:
    name: tests pass with an empty environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: No credentials, no network config, no .env
        run: |
          test ! -f .env
          if git grep -nE '\$\{\{ *secrets\.' -- .github; then exit 1; fi
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|ed25519:[1-9A-HJ-NP-Za-km-z]{60,}' -- . ':!contracts/evm/lib' ':!web/package-lock.json'; then exit 1; fi
      - name: npm test with a scrubbed environment
        run: env -i PATH="$PATH" HOME="$HOME" npm test

  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  near-contract:
    name: NEAR contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/near-registry
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain pinned by rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/near-registry
      - run: cargo test --locked

  evm-contract:
    name: EVM contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/evm
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge fmt --check
      - run: forge test
      - name: tracked AgentVault artifacts must not be stale
        run: node scripts/evm-vault-build.mjs && git diff --exit-code -- contracts/evm/dist
