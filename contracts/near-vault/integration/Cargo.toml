[package]
name = "autonear-vault-integration"
version = "1.0.0"
edition = "2021"
description = "Real NEAR sandbox integration test for autonear-vault (separate crate: near-workspaces needs a newer rustc than the contract pin)"
license = "MIT"
publish = false

[dev-dependencies]
near-workspaces = { version = "=0.22.1", default-features = false }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
wasmparser = "0.121"

[workspace]
