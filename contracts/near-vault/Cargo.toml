[package]
name = "autonear-vault"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "AutoNEAR Mandate Vault v1 (NEAR)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.6.0", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.6.0", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

[workspace]
