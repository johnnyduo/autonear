[package]
name = "near-mock-token"
version = "1.0.0"
edition = "2021"
rust-version = "1.81"
description = "AutoNEAR Mock USDC: TESTNET-ONLY NEP-141 token, anyone can mint (capped per call)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.6.0", default-features = false }
near-contract-standards = { version = "=5.6.0", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.6.0", default-features = false, features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true

[workspace]
